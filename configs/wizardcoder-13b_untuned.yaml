# Table 1, WizardCoder-Python-13B-V1.0, ADE_-L: compression only (I1 + I2), no light fold-in adaptation.
task: code                        # benchmark: MBPP (EvalPlus)
base_model: codellama/CodeLlama-13b-Python-hf
aligned_model: WizardLMTeam/WizardCoder-Python-13B-V1.0
alpha: 0.0625                     # target compression ratio (1/16)
# I1. output-aware capacity allocation
calib_dataset: magicoder
r_min: 384                        # minimum rank R_min per module (3 x G)
alloc_kappa: 1.0                  # rank share proportional to S^kappa (1 = paper)
# I3. light fold-in adaptation (0 epochs = ADE_-L)
epochs: 0

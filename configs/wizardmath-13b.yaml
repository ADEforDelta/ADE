# Table 1, WizardMath-13B-V1.0, ADE: compression (I1 + I2) and light fold-in adaptation (I3).
task: math                        # benchmark: GSM8K
base_model: meta-llama/Llama-2-13b-hf
aligned_model: WizardLMTeam/WizardMath-13B-V1.0
alpha: 0.0625                     # target compression ratio (1/16)
# I1. output-aware capacity allocation
calib_dataset: metamath
r_min: 384                        # minimum rank R_min per module (3 x G)
alloc_kappa: 1.0                  # rank share proportional to S^kappa (1 = paper)
# I3. light fold-in adaptation (gamma, rho)
epochs: 1
train_data: metamath_gsm
num_train_samples: 5000
learning_rate: 1.0e-3
weight_decay: 0.0
warmup_ratio: 0.1
max_grad_norm: 1.0
batch_size: 1
grad_accum: 6
lambda_lm: 1.0
lambda_kd: 1.0
lambda_re: 3000
kd_reduction: tokenmean           # KL summed over the sequence (batchmean) or averaged per token (tokenmean)
